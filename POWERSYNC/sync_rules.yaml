# =====================================================================
# YDS NIGHT · Regles de synchronisation PowerSync (Sync Streams)
# A coller dans le tableau de bord PowerSync > Sync Streams, puis "Deploy".
#
# Principe : chaque appareil ne recoit QUE les donnees de SON club.
#   - Tout le monde (patron, gerant, serveuse) : le club, les reglages,
#     l'equipe, les tables, le menu, les categories, les soirees.
#   - Patron et gerant : toutes les notes, encaissements, caisse, stock.
#   - Serveuse : seulement SES notes (et leurs boissons/paiements).
# Les prix d'achat et les couts ne sont JAMAIS synchronises (ils restent
# sur le serveur ; le patron les voit via les rapports).
# =====================================================================

config:
  edition: 3

streams:
  # ----- Commun a tous les membres du club -----
  club_commun:
    auto_subscribe: true
    with:
      mon_club: SELECT club_id FROM members WHERE user_id = auth.user_id() AND active = true
    queries:
      - SELECT * FROM clubs WHERE id IN mon_club
      - SELECT * FROM settings WHERE club_id IN mon_club
      - SELECT id, club_id, user_id, login, role, display_name, phone, active, created_at
          FROM members WHERE club_id IN mon_club
      - SELECT id, club_id, name, zone, is_fixed, active, sort_order, created_by, created_at, current_tab_id
          FROM club_tables WHERE club_id IN mon_club
      - SELECT * FROM categories WHERE club_id IN mon_club
      - SELECT id, club_id, category_id, name, sale_price, track_stock, min_stock, active,
               sort_order, created_at, updated_at
          FROM products WHERE club_id IN mon_club
      - SELECT * FROM nights WHERE club_id IN mon_club

  # ----- Patron et gerant : toute l'activite du club -----
  staff:
    auto_subscribe: true
    with:
      club_staff: SELECT club_id FROM members
                    WHERE user_id = auth.user_id() AND active = true AND role IN ('patron', 'gerant')
    queries:
      - SELECT * FROM tabs WHERE club_id IN club_staff
      - SELECT id, club_id, tab_id, product_id, product_name, quantity, unit_price, status,
               requested_at, requested_by, served_by, served_at, removed_by, removed_at, removed_reason
          FROM tab_items WHERE club_id IN club_staff
      - SELECT * FROM payments WHERE club_id IN club_staff
      - SELECT * FROM cash_movements WHERE club_id IN club_staff
      - SELECT * FROM expenses WHERE club_id IN club_staff
      - SELECT * FROM suppliers WHERE club_id IN club_staff
      - SELECT * FROM inventories WHERE club_id IN club_staff
      - SELECT id, club_id, product_id, quantity, supplier_id, note, member_id, created_at
          FROM stock_entries WHERE club_id IN club_staff
      - SELECT * FROM stock_movements WHERE club_id IN club_staff

  # ----- Serveuse : seulement ses propres notes -----
  serveuse:
    auto_subscribe: true
    with:
      mes_notes: SELECT t.id FROM tabs t
                   JOIN members m ON m.id = t.waitress_id
                   WHERE m.user_id = auth.user_id() AND m.active = true
    queries:
      - SELECT * FROM tabs WHERE id IN mes_notes
      - SELECT id, club_id, tab_id, product_id, product_name, quantity, unit_price, status,
               requested_at, requested_by, served_by, served_at, removed_by, removed_at, removed_reason
          FROM tab_items WHERE tab_id IN mes_notes
      - SELECT * FROM payments WHERE tab_id IN mes_notes
